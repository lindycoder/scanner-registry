api_version: 1.0


id: boostsecurityio/baseline
name: BoostSecurity Scanner
namespace: boostsecurityio/baseline
scan_types:
  - sast
  - cicd


config:
  support_diff_scan: true
  include_files:
    - "*.crx"
    - "*.deb"
    - "*.dex"
    - "*.dey"
    - "*.elf"
    - "*.o"
    - "*.so"
    - "*.iso"
    - "*.class"
    - "*.jar"
    - "*.bundle"
    - "*.dylib"
    - "*.lib"
    - "*.msi"
    - "*.dll"
    - "*.drv"
    - "*.efi"
    - "*.exe"
    - "*.ocx"
    - "*.pyc"
    - "*.pyo"
    - "*.par"
    - "*.rpm"
    - "*.whl"

steps:
    - scan:
        command:
          docker:
            image: ghcr.io/boostsecurityio/scanner-publishing/boost-scanner-native:740d2ba@sha256:83dc303403ced9513ff8b8733d4d56c08845c967f278a3b48cbbc67b3d998673
            command: scanner scan
            workdir: /src
          name: scanner
        format: sarif
